# 最小故事样例：小镇失窃案（匿名通用示例，用于验收；不是任何具体作品）
# 用法：大纲页「粘贴」导入本文件 → 执行页切到「线索推进」→ 表格绑定填入 插件绑定.yaml 的内容。
# 配套表格：线索推进表格模板.json；关键事实表、知情表需要预建的行见文末注释。
剧情_卷一_小镇失窃案:
  阶段一_报案:
    AI指令: 节奏平缓，以日常对话为主。
    主线节点:
      - id: n_report
        名称: 接受报案
        入口: 去杂货店看看出了什么事
        地点: 杂货店
        场景: 杂货店老板娘神色慌张，柜台后的钱箱被撬开了。
        发现:
          - 事实: F_box
            内容: 钱箱的锁是从里面被撬开的，不像是外人砸开的。
            记录: 主角亲自查看钱箱并看出撬痕方向时，记 F_box 为已核实。
        完成条件: {事实: F_box}
        作者备注: <仅作者>真正的小偷是老板娘的侄子阿伟。</仅作者>
  阶段二_调查:
    AI指令: 允许玩家自由选择先查哪条线。
    # 账本必须查到（必需节点）；另外老人的证词和后门手印任有一样，本阶段才结束（证人拒绝作证时，凭手印也能继续）。
    结束条件: {任一: [{表: "知情表/F_seen@user/获知方式 == 被告知"}, {事实: F_print}]}
    主线节点:
      - id: n_ledger
        名称: 查账本
        入口: 翻一翻店里的账本
        地点: 杂货店后屋
        场景: 后屋堆着几年的账本，最近一本有被撕掉的页。
        发现:
          - 事实: F_ledger
            内容: 被撕掉的那页记着一笔给阿伟的赊账。
            记录: 主角实际找到并读到这页内容（或其残片）时，记 F_ledger 为已核实。
        完成条件: {事实: F_ledger}
      # 问邻居和查后门是进入对质的两条替代途径，任走一条就能继续，所以都不是必需节点。
      - id: n_witness
        名称: 问邻居
        入口: 去问问隔壁裁缝铺的邻居
        地点: 裁缝铺
        场景: 裁缝铺的老人耳背，但记性很好。
        必需: false
        发现:
          - 事实: F_seen
            内容: 案发当晚有个年轻人从杂货店后门出来。
            记录: 裁缝铺老人当面对主角讲出案发当晚看到的情况时，记 F_seen 为存疑（只是证词），主角那一行记被告知。
        # 「知情」接受任何获知方式，包括主角自己的推测；这里要求的是「老人对主角作证」，所以限定获知方式为被告知。
        完成条件: {表: "知情表/F_seen@user/获知方式 == 被告知"}
    支线事件:
      # 证人拒绝作证时的替代途径：凭后门的独立物证也能继续。
      - id: n_backdoor
        名称: 查后门
        入口: 去看看杂货店的后门
        地点: 杂货店后门
        场景: 后门对着一条窄巷，门闩有些松动。
        发现:
          - 事实: F_print
            内容: 门闩上有新鲜的黑色机油手印。
            记录: 主角亲自查看门闩并看到手印时，记 F_print 为已核实。
        完成条件: {事实: F_print}
  阶段三_对质:
    主线节点:
      - id: n_confront
        名称: 找阿伟
        入口: 去找老板娘的侄子谈谈
        地点: 镇口的修车铺
        场景: 阿伟在修车铺打零工，看到主角时手里的扳手掉在了地上。
        发现:
          - 事实: F_talk
            内容: 阿伟承认拿了钱，说是为了还赌债。
            记录: 正文写出阿伟亲口承认拿了钱时，记 F_talk 为已核实；内容只写他实际说出的部分，没提赌债就不写赌债。
        完成条件: {事实: F_talk}
        # 进对质场景时，把主角手里的账页和证词一起带给正文（阶段进入条件里引用的事实也会自动带上，这里写出来更清楚）。
        相关事实: [F_ledger, F_seen, F_print]

# 关键事实表需要预建的行（编号, 标签）：
#   F_box 钱箱撬痕 / F_ledger 撕掉的账页 / F_seen 邻居目击 / F_print 后门门闩 / F_talk 修车铺对话
# 知情表需要预建的行（事实@角色）：
#   F_seen@user, F_seen@老板娘, F_ledger@user, F_ledger@老板娘
# 也可以用 build-template.mjs 的 buildTemplate({ factRows, knowRows, controlRow }) 一次生成带预建行的模板。
