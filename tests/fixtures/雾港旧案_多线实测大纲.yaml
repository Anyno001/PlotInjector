# 实测样稿：雾港旧案·多线（线索推进，两段主线 + 三条短支线）
# 给 2026-11-14 实测前全面审阅第六节的实测步骤用。每个发现都很容易在正文里看清，方便核对「给了什么、演了什么、表里记了什么」。
# 用法：先进入要测的聊天（至少有一楼 AI 回复）→ 剧情注入器大纲页「导入文件」导入本文件 → 执行页（项目没启用时先点「设为本卡当前项目」）→
#       推进方式选「线索推进」→「生成线索模板…」（标签可以点「自动填写」）。
#
# 角色（主角写作 user）：
#   阿芷   失踪者的妹妹（委托人）
#   老周   码头更夫
#   沈砚   报社学徒（主角的同伴）
#   林掌柜 当铺掌柜
#
# 三条支线：
#   S01 茶馆的旧照片 —— 没有前提，随时可以开始（测：入口提示、走进去才开始、名额）
#   S02 照片背面的地址 —— 等 S01 完成（测：线之间的先后）
#   S03 沈砚的心事 —— 等重要角色表里沈砚的「人际关系」写出他把主角当朋友（测：表格条件、一格多人只取主角那一项）
#       手动测试时：在数据库里把沈砚那一行的人际关系改成「主角:朋友;阿芷:点头之交」，S03 就会变成可开启。
# 作者真相：林掌柜就是当年永昌号的账房，只写在 <仅作者> 里（测：正文和请求里都不能出现）。

剧情_M1_失踪的哥哥:
  线:
    编号: M1
    类型: 主线
    简介: 阿芷的哥哥三天前在码头失踪了。
  阶段1_委托:
    AI指令: 节奏平缓。阿芷在报社门口等主角，情绪克制。
    主线节点:
      - id: m1_request
        名称: 接受委托
        入口: 去报社门口见委托人
        地点: 报社门口
        场景: 一个穿灰布衫的年轻女人攥着一张旧船票，说哥哥三天前在码头失踪。
        发现:
          - 事实: F_ticket
            内容: 船票是「永昌号」三天前夜班的票，票根被撕掉了一半。
            记录: 主角亲手拿到船票、看清船名和日期时登记。
        完成条件: {事实: F_ticket}
        作者备注: <仅作者>林掌柜就是当年永昌号的账房，哥哥撞见他在仓库清点走私货。</仅作者>
  阶段2_码头:
    AI指令: 允许玩家自由选择先去哪里，不要催促。
    主线节点:
      - id: m1_watchman
        名称: 问更夫
        入口: 去找码头的老更夫打听那晚的事
        地点: 更夫棚
        场景: 老周缩在棚里烤火，看见生人就把灯捻小了。
        发现:
          - 事实: F_watchman
            内容: 老周说那晚看见两个人架着一个年轻人往当铺方向走。
            记录: 老周当面对主角讲出那晚看到的情况时登记。
        完成条件: {事实: F_watchman}

剧情_M2_当铺:
  线:
    编号: M2
    类型: 主线
    简介: 线索指向码头边的当铺。
    开启条件: {线: M1 == 完成}
  阶段1_当铺:
    AI指令: 气氛紧张，林掌柜表面客气。不要替主角决定动手与否。
    主线节点:
      - id: m2_pawnshop
        名称: 进当铺
        入口: 去当铺会会林掌柜
        地点: 当铺
        场景: 柜台很高，林掌柜隔着栅栏打量主角，说自己只是个老实生意人。
        发现:
          - 事实: F_cellar
            内容: 柜台后的地板有一块是新换的，下面传出敲击声。
            记录: 主角实际发现那块新地板、听到敲击声时登记。
        完成条件: {事实: F_cellar}

剧情_S01_茶馆的旧照片:
  线:
    编号: S01
    类型: 支线
    简介: 码头茶馆的老板想找人帮忙认一张旧照片。
    入口提示: 路过码头茶馆时，老板在门口招呼主角进去喝口茶。
  阶段1_认照片:
    AI指令: 轻松的日常小插曲，和主线无关。
    主线节点:
      - id: s01_photo
        名称: 看旧照片
        入口: 进码头茶馆，看看老板手里的旧照片
        地点: 码头茶馆
        场景: 茶馆老板把一张发黄的合影推到主角面前，照片上是十几个穿制服的船员。
        发现:
          - 事实: F_s01_photo
            内容: 照片背面用铅笔写着「永昌号全体船员，民国十九年」；右下角还有一行很淡的小字，是城南旧巷的一个门牌。
            记录: 主角把照片翻过来、看清背面那行铅笔字时登记。
        完成条件: {事实: F_s01_photo}

剧情_S02_照片背面的地址:
  线:
    编号: S02
    类型: 支线
    简介: 旧照片背面还有一个模糊的地址。
    开启条件: {线: S01 == 完成}
    入口提示: 主角想起照片背面角落那行很淡的门牌。
  阶段1_找地址:
    AI指令: 安静的寻访，地址上住着一个老人。
    主线节点:
      - id: s02_address
        名称: 按地址去找
        入口: 按照片背面角落的门牌去城南旧巷看看
        地点: 城南旧巷
        场景: 一栋快塌的木楼，门口坐着一个晒太阳的老人。
        发现:
          - 事实: F_s02_sailor
            内容: 老人说自己是永昌号的老水手，船早就不跑了。
            记录: 老人当面说出自己是永昌号的老水手时登记。
        完成条件: {事实: F_s02_sailor}

剧情_S03_沈砚的心事:
  线:
    编号: S03
    类型: 支线
    简介: 沈砚最近好像有心事。
    开启条件: {表: 重要角色表/沈砚/人际关系 包含 朋友, 取: 主角, 样例: {原文: "主角:同事;阿芷:点头之交", 取: 主角, 得: 同事}}
    入口提示: 沈砚欲言又止，好像想单独和主角说点什么。
  阶段1_谈心:
    AI指令: 安静的对话，不要煽情。
    主线节点:
      - id: s03_talk
        名称: 听沈砚说
        入口: 找个安静的地方，问问沈砚怎么了
        地点: 报社后院
        场景: 沈砚坐在后院的石阶上，手里捏着一封没拆的信。
        发现:
          - 事实: F_s03_letter
            内容: 沈砚说那封信是老家寄来的，催他回去接手家里的铺子。
            记录: 沈砚当面说出信是老家寄来、催他回去时登记。
        完成条件: {事实: F_s03_letter}
